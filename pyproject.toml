[project]
name = "mle"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
package-mode = false
dependencies = [
    "pandas (>=2.3.1,<3.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "sqlalchemy (>=2.0.42,<3.0.0)",
    "ruff (>=0.12.7,<0.13.0)",
    "scikit-learn (>=1.7.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [
    "src/config/__init__.py",
    "src/config/.env",
    "src/db/db.sqlite",
    "src/logs",
    "src/model/models",
]

[tool.ruff.exter-per-file-ignore]
"src/config/__init__.py" = ["F401"]